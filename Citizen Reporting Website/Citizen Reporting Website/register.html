
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f2">
    <title>Create Account | GREENWICH</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/shared.css">
    <link rel="stylesheet" href="styles/auth.css">

    <script src="scripts/auth.js" defer></script>
</head>

<body>

    <header class="navbar sticky-top px-3 px-lg-5">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="brand-mark">G</span>
                <span class="fs-4 fw-bold">GREENWICH<span class="brand-period">.</span></span>
            </a>

            <a href="index.html" class="btn home-track-button">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-heading">
                <span class="auth-icon">
                    <i class="bi bi-person-plus"></i>
                </span>

                <p class="auth-eyebrow">JOIN YOUR COMMUNITY</p>
                <h1>Create an Account</h1>
                <p>Register to submit reports and keep track of community concerns.</p>
            </div>

            <form id="register-form">

                <div class="mb-3">
                    <label for="register-name" class="form-label">Full name</label>
                    <input type="text" class="form-control"
                           id="register-name" placeholder="Your full name" required>
                </div>

                <div class="mb-3">
                    <label for="register-email" class="form-label">Email address</label>
                    <input type="email" class="form-control"
                           id="register-email" placeholder="you@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="register-password" class="form-label">Password</label>
                    <input type="password" class="form-control"
                           id="register-password" placeholder="Create a password"
                           minlength="6" required>
                </div>

                <div class="mb-3">
                    <label for="register-confirm-password" class="form-label">Confirm password</label>
                    <input type="password" class="form-control"
                           id="register-confirm-password"
                           placeholder="Re-enter your password" required>
                </div>

                <p id="register-message" class="auth-message" role="status" aria-live="polite"></p>

                <button type="submit" class="btn auth-submit w-100">
                    Create Account <i class="bi bi-arrow-right"></i>
                </button>

            </form>

            <div class="auth-switch">
                Already have an account?
                <a href="login.html">Log in</a>
            </div>

        </section>
    </main>

</body>
</html>
